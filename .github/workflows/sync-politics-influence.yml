name: Sync politics influence data

on:
  workflow_dispatch:

concurrency:
  group: sync-politics-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_DEPLOY_KEY }}

      - name: Trust the production host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Finalize influence recovery
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" <<'REMOTE'
          set -Eeuo pipefail
          api_container="wtp-api"
          docker inspect "$api_container" >/dev/null
          run_job() {
            docker exec "$api_container" sh -c '
              DATABASE_URL="${WTP_DB_URL:?WTP_DB_URL is required}"
              LDA_SYNC_START_YEAR=2026
              export DATABASE_URL LDA_SYNC_START_YEAR
              exec python -m "$@"
            ' sh "$@"
          }

          echo "All durable source imports have completed or are explicitly blocked; finalizing coverage and caches."

          echo "::group::Coverage"
          docker exec "$api_container" python -c 'import json; from sqlalchemy import text; from models.database import SessionLocal; db=SessionLocal(); tables=["finance_lobbying_records","health_lobbying_records","lobbying_records","energy_lobbying_records","transportation_lobbying_records","defense_lobbying_records","chemical_lobbying_records","agriculture_lobbying_records","telecom_lobbying_records","education_lobbying_records","finance_government_contracts","health_government_contracts","government_contracts","energy_government_contracts","transportation_government_contracts","defense_government_contracts","chemical_government_contracts","agriculture_government_contracts","telecom_government_contracts","education_government_contracts"]; counts={table:db.execute(text(f"SELECT COUNT(*) FROM {table}")).scalar() for table in tables}; print(json.dumps(counts,indent=2)); db.close()'
          docker exec "$api_container" python -c 'from sqlalchemy import text; from models.database import SessionLocal; db=SessionLocal(); lobbying=sum(db.execute(text(f"SELECT COUNT(*) FROM {t}")).scalar() for t in ["finance_lobbying_records","health_lobbying_records","lobbying_records","energy_lobbying_records","transportation_lobbying_records","defense_lobbying_records","chemical_lobbying_records","agriculture_lobbying_records","telecom_lobbying_records","education_lobbying_records"]); contracts=sum(db.execute(text(f"SELECT COUNT(*) FROM {t}")).scalar() for t in ["finance_government_contracts","health_government_contracts","government_contracts","energy_government_contracts","transportation_government_contracts","defense_government_contracts","chemical_government_contracts","agriculture_government_contracts","telecom_government_contracts","education_government_contracts"]); enforcement=sum(db.execute(text(f"SELECT COUNT(*) FROM {t}")).scalar() for t in ["finance_enforcement_actions","health_enforcement_actions","ftc_enforcement_actions","energy_enforcement_actions","transportation_enforcement_actions","defense_enforcement_actions","chemical_enforcement_actions","agriculture_enforcement_actions","telecom_enforcement_actions","education_enforcement_actions"]); donations=db.execute(text("SELECT COUNT(*) FROM company_donations")).scalar(); db.close(); print("WARNING: LDA.gov denied the production recovery host; lobbying remains externally blocked" if lobbying == 0 else f"Lobbying records present: {lobbying}"); assert contracts > 0, "No contract records imported"; assert enforcement > 0, "No enforcement records imported"; print("WARNING: FEC_API_KEY is not configured; donations remain externally blocked" if donations == 0 else f"Donation records present: {donations}"); print({"lobbying":lobbying,"contracts":contracts,"enforcement":enforcement,"donations":donations})'
          run_job jobs.warm_closed_loop_cache --quiet
          curl --fail --silent --show-error http://127.0.0.1:8006/health >/dev/null
          echo "::endgroup::"
          REMOTE

      - name: Verify the public API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://api.wethepeople.place/aggregate/all/lobbying?limit=1 >/dev/null
          curl --fail --silent --show-error \
            https://api.wethepeople.place/aggregate/all/contracts?limit=1 >/dev/null
          curl --fail --silent --show-error \
            https://api.wethepeople.place/aggregate/all/enforcement?limit=1 >/dev/null
