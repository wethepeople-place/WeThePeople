name: Deploy backend to Hetzner

on:
  push:
    branches: [main]
    paths:
      - "connectors/**"
      - "jobs/**"
      - "models/**"
      - "routers/**"
      - "services/**"
      - "utils/**"
      - "main.py"
      - "requirements.txt"
      - "alembic/**"
      - "alembic.ini"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_DEPLOY_KEY }}

      - name: Trust the production host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Fast-forward production and restart services
        shell: bash
        run: |
          set -euo pipefail
          ssh "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" 'bash -s' <<'REMOTE'
            set -Eeuo pipefail

            api_container="wtp-api"
            checkout="/opt/wethepeople/app"
            docker inspect "$api_container" > /dev/null
            git -C "$checkout" rev-parse --is-inside-work-tree > /dev/null
            if [ -n "$(git -C "$checkout" status --porcelain --untracked-files=no)" ]; then
              echo "Refusing to deploy over tracked production changes" >&2
              git -C "$checkout" status --short --untracked-files=no >&2
              exit 1
            fi

            previous_checkout="$(git -C "$checkout" rev-parse HEAD)"
            git -C "$checkout" fetch --prune origin main
            target="$(git -C "$checkout" rev-parse origin/main)"
            git -C "$checkout" merge-base --is-ancestor "$previous_checkout" "$target"
            short_target="$(printf '%s' "$target" | cut -c1-7)"
            release="/opt/wethepeople/releases/$short_target"
            image_tag="wethepeople-api:$short_target"
            test ! -e "$release"
            mkdir "$release"
            git -C "$checkout" archive "$target" | tar -x -C "$release"

            docker build               --label "org.opencontainers.image.revision=$target"               --tag "$image_tag"               "$release"

            inspect_file="/run/wtp-api-inspect-$short_target.json"
            env_file="/run/wtp-api-env-$short_target"
            docker inspect "$api_container" > "$inspect_file"
            port_spec="$(python3 - "$inspect_file" "$env_file" <<'PY'
            import json
            import pathlib
            import sys

            config = json.loads(pathlib.Path(sys.argv[1]).read_text())[0]
            values = config["Config"].get("Env") or []
            if any("\n" in value or "\r" in value for value in values):
                raise SystemExit("container environment contains unsupported newlines")
            pathlib.Path(sys.argv[2]).write_text("\n".join(values) + "\n")
            binding = (config["HostConfig"].get("PortBindings") or {}).get("8006/tcp") or []
            if len(binding) != 1 or not binding[0].get("HostPort"):
                raise SystemExit("expected one 8006/tcp host binding")
            host = binding[0].get("HostIp") or ""
            port = binding[0]["HostPort"]
            print(f"{host + ':' if host else ''}{port}:8006")
            PY
            )"
            chmod 600 "$inspect_file" "$env_file"
            restart_policy="$(docker inspect -f '{{ .HostConfig.RestartPolicy.Name }}' "$api_container")"
            network_mode="$(docker inspect -f '{{ .HostConfig.NetworkMode }}' "$api_container")"
            previous_id="$(docker inspect -f '{{ .Id }}' "$api_container" | cut -c1-12)"
            previous_container="wtp-api-rollback-$previous_id"
            test "$restart_policy" = "unless-stopped"
            test "$network_mode" = "bridge"
            if docker ps -a --format '{{.Names}}' | grep -Fxq "$previous_container"; then
              echo "Rollback container name already exists: $previous_container" >&2
              exit 1
            fi

            rollback_needed=0
            rollback() {
              code=$?
              if [ "$rollback_needed" = "1" ]; then
                docker rm -f "$api_container" > /dev/null 2>&1 || true
                docker rename "$previous_container" "$api_container" || true
                docker start "$api_container" > /dev/null || true
              fi
              rm -f "$inspect_file" "$env_file"
              exit "$code"
            }
            trap rollback ERR

            docker stop "$api_container" > /dev/null
            docker rename "$api_container" "$previous_container"
            rollback_needed=1
            docker run --detach               --name "$api_container"               --restart "$restart_policy"               --network "$network_mode"               --publish "$port_spec"               --volumes-from "$previous_container"               --env-file "$env_file"               "$image_tag" > /dev/null

            healthy=0
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error http://127.0.0.1:8006/health > /dev/null; then
                echo "Local health check passed on attempt $attempt"
                healthy=1
                break
              fi
              sleep 5
            done
            test "$healthy" = "1"
            git -C "$checkout" switch --detach "$target" > /dev/null
            if systemctl list-unit-files wtp-congress-legislation-sync.timer > /dev/null 2>&1; then
              systemctl restart wtp-congress-legislation-sync.timer
            fi

            rollback_needed=0
            trap - ERR
            rm -f "$inspect_file" "$env_file"
            echo "deployed_sha=$target"
            echo "rollback_container=$previous_container"
          REMOTE

      - name: Verify the public API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             --retry 12 --retry-delay 5 --retry-all-errors             https://api.wethepeople.place/health > /dev/null
