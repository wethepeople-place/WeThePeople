name: Deploy backend to Hetzner

on:
  push:
    branches: [main]
    paths:
      - "connectors/**"
      - "jobs/**"
      - "models/**"
      - "routers/**"
      - "services/**"
      - "utils/**"
      - "main.py"
      - "requirements.txt"
      - "alembic/**"
      - "alembic.ini"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_DEPLOY_KEY }}

      - name: Trust the production host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Fast-forward production and restart services
        shell: bash
        run: |
          set -euo pipefail
          ssh "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" 'bash -s' <<'REMOTE'
            set -euo pipefail

            api_container="wtp-api"
            docker inspect "$api_container" > /dev/null

            project_dir="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$api_container")"
            config_files="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$api_container")"
            api_service="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$api_container")"
            test -n "$project_dir"
            test -n "$config_files"
            test -n "$api_service"
            cd "$project_dir"

            current_branch="$(git branch --show-current)"
            echo "compose_project_dir=$project_dir"
            echo "compose_config_files=$config_files"
            echo "compose_api_service=$api_service"
            echo "current_branch=${current_branch:-detached}"
            echo "current_head=$(git rev-parse HEAD)"
            if [ "$current_branch" != "main" ]; then
              echo "Refusing to deploy from a production checkout that is not on main" >&2
              exit 1
            fi
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Refusing to deploy over tracked production changes" >&2
              git status --short --untracked-files=no >&2
              exit 1
            fi

            previous="$(git rev-parse HEAD)"
            git fetch --prune origin main
            git merge-base --is-ancestor "$previous" origin/main
            git merge --ff-only origin/main

            IFS=',' read -r -a compose_files <<< "$config_files"
            compose_args=()
            for compose_file in "${compose_files[@]}"; do
              compose_args+=(-f "$compose_file")
            done
            docker compose --project-directory "$project_dir" "${compose_args[@]}" up -d --build "$api_service"
            if systemctl list-unit-files wtp-congress-legislation-sync.timer > /dev/null 2>&1; then
              systemctl restart wtp-congress-legislation-sync.timer
            fi

            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error http://127.0.0.1:8006/health > /dev/null; then
                echo "Local health check passed on attempt $attempt"
                echo "deployed_sha=$(git rev-parse HEAD)"
                exit 0
              fi
              sleep 5
            done
            echo "Local health check failed after 90 seconds" >&2
            docker logs --tail 100 "$api_container" >&2 || true
            exit 1
          REMOTE

      - name: Verify the public API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             --retry 12 --retry-delay 5 --retry-all-errors             https://api.wethepeople.place/health > /dev/null
