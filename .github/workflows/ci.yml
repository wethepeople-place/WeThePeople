name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Focused backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run adoption gate
        env:
          WTP_ENV: development
          WTP_REQUIRE_AUTH: "0"
          WTP_JWT_SECRET: ci-only-secret-do-not-use-in-production
          WTP_DB_URL: sqlite://
          DISABLE_STARTUP_FETCH: "1"
        run: >-
          python -m pytest --tb=short -q
          tests/test_housing_rent_contract.py
          tests/test_housing_rent_schema.py
          tests/test_housing_rent_loader.py
          tests/test_housing_rent_fetch_adapters.py
          tests/test_civic_slice_contract.py
          tests/test_committee_initialization.py
          tests/test_congress_legislators_import.py
          tests/test_vote_bill_backfill.py

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run inherited frontend tests (known failures)
        continue-on-error: true
        run: npm test -- --run

  mobile:
    name: Mobile type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
