name: Sync 2026 politics data

on:
  workflow_dispatch:
concurrency:
  group: sync-politics-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Download official Senate roll-call XML
        shell: bash
        run: |
          set -euo pipefail
          vote_dir="$RUNNER_TEMP/senate-votes"
          menu_url="https://www.senate.gov/legislative/LIS/roll_call_lists/vote_menu_119_2.htm"
          base_url="https://www.senate.gov/legislative/LIS/roll_call_votes/vote1192"
          user_agent="WeThePeople/1.0 (civic transparency; https://app.wethepeople.place)"
          mkdir -p "$vote_dir"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 20 --max-time 60 \
            --user-agent "$user_agent" "$menu_url" -o "$vote_dir/menu.htm"
          grep -oE 'vote_119_2_[0-9]{5}\.htm' "$vote_dir/menu.htm" \
            | sort -u | sed 's/\.htm$/.xml/' > "$vote_dir/files.txt"
          test -s "$vote_dir/files.txt"

          actual="$(wc -l < "$vote_dir/files.txt" | tr -d ' ')"
          max_vote="$(sed -E 's/.*_([0-9]{5})\.xml/\1/' "$vote_dir/files.txt" \
            | sed 's/^0*//' | sort -n | tail -1)"
          if [ "$actual" -ne "$max_vote" ]; then
            echo "Official Senate index is incomplete: found $actual of $max_vote roll calls" >&2
            exit 1
          fi

          while IFS= read -r file; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-all-errors --connect-timeout 20 --max-time 60 \
              --user-agent "$user_agent" "$base_url/$file" -o "$vote_dir/$file"
          done < "$vote_dir/files.txt"

          downloaded="$(find "$vote_dir" -maxdepth 1 -name 'vote_119_2_*.xml' | wc -l | tr -d ' ')"
          if [ "$downloaded" -ne "$actual" ]; then
            echo "Downloaded $downloaded of $actual official Senate XML files" >&2
            exit 1
          fi
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/senate-votes.tgz" senate-votes

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_DEPLOY_KEY }}

      - name: Trust the production host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload official Senate roll calls
        shell: bash
        run: |
          set -euo pipefail
          scp -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$RUNNER_TEMP/senate-votes.tgz" \
            "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}:/tmp/wtp-senate-votes.tgz"

      - name: Back up, migrate, and sync 2026 politics data
        shell: bash
        env:
          API_KEY_CONGRESS: ${{ secrets.API_KEY_CONGRESS }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$API_KEY_CONGRESS"
            cat <<'REMOTE'
            set -Eeuo pipefail
            api_container="wtp-api"
            timer="wtp-congress-legislation-sync.timer"
            service="wtp-congress-legislation-sync.service"
            temp_root="$(mktemp -d)"
            timer_was_active=0

            cleanup() {
              code=$?
              rm -rf "$temp_root"
              docker exec "$api_container" rm -rf /tmp/congress-legislators /tmp/senate-votes >/dev/null 2>&1 || true
              rm -f /tmp/wtp-senate-votes.tgz
              if [ "$timer_was_active" = "1" ]; then
                systemctl start "$timer" || true
              fi
              exit "$code"
            }
            trap cleanup EXIT

            docker inspect "$api_container" >/dev/null
            if systemctl list-unit-files "$timer" >/dev/null 2>&1; then
              timer_was_active=1
              if systemctl is-active --quiet "$timer"; then
                systemctl stop "$timer"
              fi
              for attempt in $(seq 1 120); do
                if ! systemctl is-active --quiet "$service"; then
                  break
                fi
                if [ "$attempt" = "120" ]; then
                  echo "Existing legislation sync did not finish within ten minutes" >&2
                  exit 1
                fi
                sleep 5
              done
            fi

            congress_api_key="${API_KEY_CONGRESS:-${CONGRESS_API_KEY:-}}"
            if [ -z "$congress_api_key" ]; then
              echo "Congress.gov API key was not supplied to the sync workflow" >&2
              exit 1
            fi
            echo "Received the Congress.gov API key from the protected Actions secret"
            run_with_congress_key() {
              printf '%s\n' "$congress_api_key" | docker exec -i "$api_container" sh -c '
                IFS= read -r API_KEY_CONGRESS
                export API_KEY_CONGRESS
                export WTP_ENABLE_CONGRESS_LEGISLATION_SYNC=1
                exec "$@"
              ' sh "$@"
            }

            echo "::group::Session-aware database migration"
            docker exec "$api_container" python jobs/migrate_vote_session_uniqueness.py
            echo "::endgroup::"

            echo "::group::Current members and committees"
            git clone --depth 1 https://github.com/unitedstates/congress-legislators "$temp_root/congress-legislators"
            docker cp "$temp_root/congress-legislators" "$api_container":/tmp/congress-legislators
            docker exec "$api_container" python jobs/import_congress_legislators.py \
              --data-dir /tmp/congress-legislators \
              --bootstrap-members
            echo "::endgroup::"

            echo "::group::119th Congress legislation"
            run_with_congress_key \
              python jobs/sync_congress_legislation.py \
              --congress 119 \
              --max-requests 4500
            echo "::endgroup::"

            echo "::group::Member sponsored and cosponsored legislation"
            # Process the full active roster in restartable batches.  The job
            # records each successful member's refresh time, so every pass
            # naturally advances to the next overdue group.
            for batch in $(seq 1 7); do
              echo "Member action batch $batch of 7"
              run_with_congress_key python jobs/sync_member_actions.py \
                --limit-pages 2 \
                --batch-size 80
            done
            echo "::endgroup::"

            echo "::group::2026 House roll calls"
            run_with_congress_key python jobs/sync_votes.py \
              --congress 119 \
              --session 2 \
              --limit 2000
            echo "::endgroup::"

            echo "::group::2026 Senate roll calls"
            tar -xzf /tmp/wtp-senate-votes.tgz -C "$temp_root"
            docker exec "$api_container" rm -rf /tmp/senate-votes
            docker cp "$temp_root/senate-votes" "$api_container":/tmp/senate-votes
            docker exec "$api_container" python jobs/import_senate_xml.py \
              --source-dir /tmp/senate-votes \
              --congress 119 \
              --session 2
            unset congress_api_key
            echo "::endgroup::"

            echo "::group::2026 House financial disclosures"
            docker exec "$api_container" python jobs/sync_trades_from_disclosures.py \
              --year 2026
            echo "::endgroup::"

            echo "::group::Final production coverage"
            docker exec "$api_container" python -c 'import json; from sqlalchemy import text; from models.database import SessionLocal; db=SessionLocal(); q=lambda sql: [list(row) for row in db.execute(text(sql)).all()]; report={"votes_2026":q("SELECT chamber, COUNT(*), MIN(vote_date), MAX(vote_date) FROM votes WHERE congress=119 AND vote_session=2 GROUP BY chamber ORDER BY chamber"),"member_votes_2026":q("SELECT v.chamber, COUNT(mv.id) FROM votes v LEFT JOIN member_votes mv ON mv.vote_id=v.id WHERE v.congress=119 AND v.vote_session=2 GROUP BY v.chamber ORDER BY v.chamber"),"bills_119":q("SELECT COUNT(*), MAX(updated_at) FROM bills WHERE congress=119"),"member_bill_records":q("SELECT COUNT(*) FROM member_bill_ground_truth"),"actions":q("SELECT COUNT(*), MAX(updated_at) FROM actions"),"trades":q("SELECT COUNT(*), MIN(transaction_date), MAX(transaction_date) FROM congressional_trades"),"members":q("SELECT COUNT(*) FROM tracked_members"),"committees":q("SELECT COUNT(*) FROM committees"),"memberships":q("SELECT COUNT(*) FROM committee_memberships")}; print(json.dumps(report,default=str,indent=2)); db.close()'
            curl --fail --silent --show-error http://127.0.0.1:8006/health >/dev/null
            echo "::endgroup::"
          REMOTE
          } | ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o TCPKeepAlive=yes \
            "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" \
            'IFS= read -r API_KEY_CONGRESS; export API_KEY_CONGRESS; bash -s'

      - name: Verify the public API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://api.wethepeople.place/health >/dev/null
