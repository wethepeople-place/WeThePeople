name: Sync state legislature data

on:
  workflow_dispatch:

concurrency:
  group: sync-politics-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Require OpenStates API key
        shell: bash
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENSTATES_API_KEY" ]; then
            echo "OPENSTATES_API_KEY is not configured in the production environment" >&2
            exit 1
          fi

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_DEPLOY_KEY }}

      - name: Trust the production host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync OpenStates legislators and bills
        shell: bash
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$OPENSTATES_API_KEY"
            cat <<'REMOTE'
          set -Eeuo pipefail
          api_container="wtp-api"
          docker inspect "$api_container" >/dev/null
          openstates_key="${OPENSTATES_API_KEY:-}"
          if [ -z "$openstates_key" ]; then
            echo "OpenStates API key was not supplied" >&2
            exit 1
          fi
          printf '%s\n' "$openstates_key" | docker exec -i "$api_container" sh -c '
            IFS= read -r OPENSTATES_API_KEY
            export OPENSTATES_API_KEY
            python jobs/sync_state_data_all.py --legislators-only --stagger-sec 1
            exec python jobs/sync_state_data_all.py --bills-only --max-pages 3 --stagger-sec 1
          '
          docker exec "$api_container" python -c 'import json; from sqlalchemy import text; from models.database import SessionLocal; db=SessionLocal(); report={"states":db.execute(text("SELECT COUNT(DISTINCT state) FROM state_legislators")).scalar(),"legislators":db.execute(text("SELECT COUNT(*) FROM state_legislators")).scalar(),"bills":db.execute(text("SELECT COUNT(*) FROM state_bills")).scalar()}; print(json.dumps(report,indent=2)); db.close(); assert report["states"] >= 50, "State legislator coverage is incomplete"; assert report["bills"] > 0, "No state bills were imported"'
          curl --fail --silent --show-error http://127.0.0.1:8006/health >/dev/null
          REMOTE
          } | ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "${{ vars.HETZNER_USER }}@${{ vars.HETZNER_HOST }}" \
            'IFS= read -r OPENSTATES_API_KEY; export OPENSTATES_API_KEY; bash -s'

      - name: Verify the public API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://api.wethepeople.place/states >/dev/null
