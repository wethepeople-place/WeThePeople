services:
  - type: web
    name: wethepeople-api-staging
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /app/deploy/render-entrypoint.sh
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    disk:
      name: wethepeople-data-staging
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: WTP_ENV
        value: staging
      - key: WTP_DB_URL
        value: sqlite:////app/data/wethepeople.db
      - key: WTP_RUNTIME_DIR
        value: /app/data/runtime
      - key: WTP_MIGRATION_HOLD
        value: "1"
      - key: WTP_SCHEDULER_ENABLED
        value: "0"
      - key: WTP_WEB_CONCURRENCY
        value: "1"
      - key: DISABLE_STARTUP_FETCH
        value: "1"
      - key: CORS_ALLOW_ORIGINS
        value: https://app.wethepeople.place,https://www.wethepeople.place
      - key: WTP_PUBLIC_APP_URL
        value: https://app.wethepeople.place
      - key: WTP_REQUIRE_AUTH
        value: "0"
      - key: WTP_JWT_SECRET
        generateValue: true

